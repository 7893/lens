name: Lens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter=@lens/shared run build
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter=@lens/shared run build
      - run: pnpm run test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter=@lens/shared run build
      - run: pnpm run typecheck

  deploy:
    needs: [lint, test, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter=@lens/shared run build
      - run: pnpm --filter=@lens/client run build
      - run: |
          mkdir -p apps/engine/public
          cp -r apps/client/dist/* apps/engine/public/

      - name: Deploy Lens Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/engine'
          command: deploy
